services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/trento-transit.db
    volumes:
      - radar_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  radar_data:
